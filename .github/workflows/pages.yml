name: Deploy Claim Inspector to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ['claim-inspector/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run engine tests
        run: node claim-inspector/test/engine.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: claim-inspector
      - id: deployment
        uses: actions/deploy-pages@v4
