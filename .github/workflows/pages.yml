# Publishes the repository root to GitHub Pages so both apps are reachable:
#   https://<owner>.github.io/Password-Rememberer/              (Password Rememberer)
#   https://<owner>.github.io/Password-Rememberer/pocket-tally/ (Pocket Tally)
# The first run switches Pages on by itself (enablement: true below).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/password-rememberer-x2cp7z]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run parser tests
        run: node --test pocket-tally/parser.test.mjs
      - uses: actions/configure-pages@v5
        with:
          # Switch Pages on for the repository on the first run, so no
          # Settings change is needed before merging.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
