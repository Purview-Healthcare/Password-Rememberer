<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Rememberer</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; --border:#e2e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6; --accent:#5b8def; --danger:#f87171; --border:#2e333b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--border); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--border); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .entry { border-top:1px solid var(--border); padding:12px 0; }
  .entry:first-child { border-top:0; }
  .site { font-weight:600; }
  .muted { color:var(--muted); font-size:.9rem; word-break:break-all; }
  .pw { font-family:ui-monospace,monospace; }
  .msg { color:var(--danger); min-height:1.2em; font-size:.9rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🔐 Password Rememberer</h1>

  <!-- Lock screen -->
  <section id="lock" class="card">
    <p id="lockIntro" class="muted"></p>
    <label for="master">Master password</label>
    <input id="master" type="password" autocomplete="current-password">
    <div id="confirmWrap" hidden>
      <label for="master2">Confirm master password</label>
      <input id="master2" type="password" autocomplete="new-password">
    </div>
    <div class="row"><button id="unlockBtn">Unlock</button></div>
    <p id="lockMsg" class="msg"></p>
  </section>

  <!-- Vault -->
  <div id="vault" hidden>
    <section class="card">
      <strong id="formTitle">Add a password</strong>
      <label for="site">Website</label>
      <input id="site" placeholder="e.g. facebook.com" autocomplete="off">
      <label for="email">Email / username</label>
      <input id="email" placeholder="you@example.com" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="new-password">
      <div class="row">
        <button id="saveBtn">Save</button>
        <button id="genBtn" class="secondary" type="button">Generate</button>
        <button id="cancelBtn" class="secondary" type="button" hidden>Cancel edit</button>
      </div>
      <p id="formMsg" class="msg"></p>
    </section>

    <section class="card">
      <input id="search" placeholder="Search website or email…" autocomplete="off">
      <div id="list"></div>
    </section>

    <div class="row">
      <button id="exportBtn" class="secondary">Export backup</button>
      <button id="importBtn" class="secondary">Import backup</button>
      <button id="lockBtn" class="secondary">Lock</button>
      <input id="importFile" type="file" accept=".json" hidden>
    </div>
  </div>
</main>

<script>
(() => {
  const STORE = 'password-rememberer-vault-v1';
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();
  let key = null, salt = null, entries = [], editingId = null;

  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveKey(password, salt) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function persist() {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(entries)));
    localStorage.setItem(STORE, JSON.stringify({ salt: b64(salt), iv: b64(iv), data: b64(data) }));
  }

  async function load(password, blob) {
    const s = unb64(blob.salt);
    const k = await deriveKey(password, s);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, k, unb64(blob.data));
    return { s, k, items: JSON.parse(dec.decode(plain)) };
  }

  const saved = () => { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } };

  function initLock() {
    const first = !saved();
    $('lockIntro').textContent = first
      ? 'First time here: choose a master password. It encrypts everything and cannot be recovered if you forget it.'
      : 'Enter your master password to unlock.';
    $('confirmWrap').hidden = !first;
    $('unlockBtn').textContent = first ? 'Create vault' : 'Unlock';
  }

  async function unlock() {
    const pw = $('master').value, blob = saved();
    $('lockMsg').textContent = '';
    if (!pw) return $('lockMsg').textContent = 'Enter a master password.';
    try {
      if (!blob) {
        if (pw.length < 8) return $('lockMsg').textContent = 'Use at least 8 characters.';
        if (pw !== $('master2').value) return $('lockMsg').textContent = 'Passwords do not match.';
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await deriveKey(pw, salt);
        entries = [];
        await persist();
      } else {
        const r = await load(pw, blob);
        salt = r.s; key = r.k; entries = r.items;
      }
    } catch {
      return $('lockMsg').textContent = 'Wrong master password.';
    }
    $('master').value = $('master2').value = '';
    $('lock').hidden = true; $('vault').hidden = false;
    render();
  }

  function lock() {
    key = null; entries = []; salt = null; resetForm();
    $('vault').hidden = true; $('lock').hidden = false; $('list').innerHTML = '';
    initLock();
  }

  function resetForm() {
    editingId = null;
    ['site', 'email', 'pw'].forEach(i => $(i).value = '');
    $('pw').type = 'password';
    $('formTitle').textContent = 'Add a password';
    $('cancelBtn').hidden = true; $('formMsg').textContent = '';
  }

  async function save() {
    const site = $('site').value.trim(), email = $('email').value.trim(), pw = $('pw').value;
    if (!site || !pw) return $('formMsg').textContent = 'Website and password are required.';
    if (editingId) {
      const e = entries.find(x => x.id === editingId);
      Object.assign(e, { site, email, pw });
    } else {
      entries.push({ id: crypto.randomUUID(), site, email, pw });
    }
    await persist();
    resetForm(); render();
  }

  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    kids.forEach(k => n.append(k));
    return n;
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = $('list'); list.innerHTML = '';
    const shown = entries
      .filter(e => !q || e.site.toLowerCase().includes(q) || e.email.toLowerCase().includes(q))
      .sort((a, b) => a.site.localeCompare(b.site));
    if (!shown.length) list.append(el('p', { className: 'muted', textContent: entries.length ? 'No matches.' : 'Nothing saved yet.' }));
    shown.forEach(e => {
      const pwSpan = el('span', { className: 'pw', textContent: '••••••••' });
      let shownPw = false;
      const btn = (label, cls, fn) => el('button', { className: cls, textContent: label, onclick: fn });
      list.append(el('div', { className: 'entry' },
        el('div', { className: 'site', textContent: e.site }),
        el('div', { className: 'muted', textContent: e.email || '(no email)' }),
        el('div', {}, pwSpan),
        el('div', { className: 'row' },
          btn('Show', 'secondary', ev => { shownPw = !shownPw; pwSpan.textContent = shownPw ? e.pw : '••••••••'; ev.target.textContent = shownPw ? 'Hide' : 'Show'; }),
          btn('Copy', 'secondary', async ev => { await navigator.clipboard.writeText(e.pw); ev.target.textContent = 'Copied'; setTimeout(() => ev.target.textContent = 'Copy', 1200); }),
          btn('Edit', 'secondary', () => {
            editingId = e.id; $('site').value = e.site; $('email').value = e.email; $('pw').value = e.pw;
            $('formTitle').textContent = 'Edit entry'; $('cancelBtn').hidden = false; scrollTo({ top: 0, behavior: 'smooth' });
          }),
          btn('Delete', 'danger', async () => {
            if (!confirm('Delete ' + e.site + '?')) return;
            entries = entries.filter(x => x.id !== e.id); await persist(); render();
          }))));
    });
  }

  function generate() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';
    const r = crypto.getRandomValues(new Uint32Array(18));
    $('pw').value = Array.from(r, n => chars[n % chars.length]).join('');
    $('pw').type = 'text';
  }

  function exportBackup() {
    const blob = new Blob([localStorage.getItem(STORE)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'password-rememberer-backup.json' });
    a.click(); URL.revokeObjectURL(a.href);
  }

  async function importBackup(file) {
    try {
      const text = await file.text();
      const blob = JSON.parse(text);
      const pw = prompt('Master password for this backup:');
      if (pw === null) return;
      const r = await load(pw, blob);
      if (!confirm('Replace current vault with the backup (' + r.items.length + ' entries)?')) return;
      salt = r.s; key = r.k; entries = r.items; await persist(); render();
    } catch { alert('Could not import: wrong password or invalid file.'); }
  }

  $('unlockBtn').onclick = unlock;
  ['master', 'master2'].forEach(i => $(i).addEventListener('keydown', e => e.key === 'Enter' && unlock()));
  $('saveBtn').onclick = save;
  $('genBtn').onclick = generate;
  $('cancelBtn').onclick = resetForm;
  $('lockBtn').onclick = lock;
  $('search').oninput = render;
  $('exportBtn').onclick = exportBackup;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
  initLock();
})();
</script>
</body>
</html>
